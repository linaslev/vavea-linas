<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vavea &amp; Linas</title>
  <meta name="description" content="Save the date — Vavea &amp; Linas, July 31, 2027, Vilnius." />

  <meta property="og:title" content="Vavea &amp; Linas" />
  <meta property="og:description" content="July 31, 2027 — Vilnius, Lithuania." />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:,">
</head>
<body>

  <!-- Tiny abstract leaf marks, reused sparingly -->
  <svg style="display:none">
    <symbol id="leaf" viewBox="0 0 40 60">
      <path d="M20 2C30 12 34 28 28 42C24 52 20 58 20 58" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M20 2C10 12 6 28 12 42C16 52 20 58 20 58" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M20 14V52" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
    </symbol>
  </svg>

  <main>
    <section class="hero">
      <svg class="leaf leaf-a" viewBox="0 0 40 60"><use href="#leaf"/></svg>

      <p class="kicker">Save the Date</p>

      <h1 class="names">Vavea<span class="amp">&amp;</span>Linas</h1>

      <p class="date">31 · 07 · 2027</p>
      <p class="place">Vilnius, Lithuania</p>

      <div class="countdown" id="countdown" aria-live="polite">
        <div class="countdown-item">
          <span class="countdown-number" id="cd-days">0</span>
          <span class="countdown-label">days</span>
        </div>
        <div class="countdown-item">
          <span class="countdown-number" id="cd-hours">0</span>
          <span class="countdown-label">hrs</span>
        </div>
        <div class="countdown-item">
          <span class="countdown-number" id="cd-minutes">0</span>
          <span class="countdown-label">min</span>
        </div>
        <div class="countdown-item">
          <span class="countdown-number" id="cd-seconds">0</span>
          <span class="countdown-label">sec</span>
        </div>
      </div>

      <svg class="leaf leaf-b" viewBox="0 0 40 60"><use href="#leaf"/></svg>
    </section>

    <section class="rsvp" id="rsvp">
      <p class="section-note">Send us your address and we'll mail the invitation.</p>

      <form
        id="rsvp-form"
        class="rsvp-form"
        action="https://formspree.io/f/YOUR_FORM_ID"
        method="POST"
      >
        <div class="form-row">
          <input type="text" id="firstName" name="firstName" placeholder="First name" required autocomplete="given-name" />
          <input type="text" id="lastName" name="lastName" placeholder="Surname" required autocomplete="family-name" />
        </div>

        <textarea id="address" name="address" rows="2" placeholder="Address" required autocomplete="street-address"></textarea>

        <input type="text" name="_gotcha" class="hp-field" tabindex="-1" autocomplete="off" />

        <button type="submit" class="submit-btn"><span class="btn-text">Send</span></button>
      </form>

      <div id="form-success" class="form-success" hidden>
        <p>Thank you.</p>
      </div>

      <div id="form-error" class="form-error" hidden>
        <p>Something went wrong — please try again.</p>
      </div>
    </section>

    <footer class="site-footer">
      <svg class="leaf leaf-c" viewBox="0 0 40 60"><use href="#leaf"/></svg>
      <p>Vavea &amp; Linas</p>
    </footer>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
